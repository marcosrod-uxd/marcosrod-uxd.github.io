<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>CSS Workshop: Menu</title>
        <link href="../../css/menu.css" rel="stylesheet"/>
    </head>
    <body>
        <div class="menu">
            <header>
                <h1>CAMPER CAFE</h1>
                <p class="established-blurb">Est. 2020</p>
            </header>
            
            <hr/>

            <main>
                <section>
                    <h2>Coffee</h2>
                    <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee cup icon" aria-hidden="true" />
                    <article class="item">
                        <p class="coffee-flavor">French Vanilla</p><p class="price">3.00</p>
                    </article>
                    <article class="item">
                        <p class="coffee-flavor">Caramel Macchiato</p><p class="price">3.75</p>
                    </article>
                    <article class="item">
                        <p class="coffee-flavor">Pumpkin Spice</p><p class="price">3.50</p>
                    </article>
                    <article class="item">
                        <p class="coffee-flavor">Hazelnut</p><p class="price">4.00</p>
                    </article> 
                    <article class="item">
                        <p class="coffee-flavor">Mocha</p><p class="price">4.50</p>
                    </article>  
                </section>

                <section>
                    <h2>Desserts</h2>
                    <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie slice icon" aria-hidden="true" />
                    <article class="item">
                        <p class="dessert">French Vanilla</p><p class="price">3.00</p>
                    </article>
                    <article class="item">
                        <p class="dessert">Caramel Macchiato</p><p class="price">3.75</p>
                    </article>
                    <article class="item">
                        <p class="dessert">Pumpkin Spice</p><p class="price">3.50</p>
                    </article>
                    <article class="item">
                        <p class="dessert">Hazelnut</p><p class="price">4.00</p>
                    </article> 
                    <article class="item">
                        <p class="dessert">Mocha</p><p class="price">4.50</p>
                    </article>  
                </section>
            </main>
            
            <hr class="bottom-line"/>

            <footer>
                <address>
                    <p>
                        <a href="./workshop.html">Back to Workshop</a>
                    </p>
                    <p class="address">123 Free Code Camp Drive</p>
                </address>
            </footer>
        </div>
    </body>
</html>
